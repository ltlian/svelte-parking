<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Ledige parkeringsplasser</title>

  <meta name="git-commit" content="__COMMIT_HASH__" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      color-scheme: light dark;
      --background: #e8e4d9;
      --foreground: #3a352f;
      --cursor: #5a554f;
      --selection: #c9c4b8;
      --surface: #ddd8cc;
      --surface-highlight: #f0ece2;
      --border: #c4bfb3;
      --accent: #7a8a6e;
      --muted: #8a857c;
      --highlight: #b5b0a4;
      --black: #3a352f;
      --red: #b46868;
      --green: #6e7d5e;
      --yellow: #8a7a50;
      --blue: #6a78b0;
      --magenta: #7a5e6e;
      --cyan: #5e7a6e;
      --white: #c4bfb3;
      --lcd-shadow: 3px 3px 0 rgba(58, 53, 47, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #292826;
        --foreground: #c4bfb3;
        --cursor: #a09a8e;
        --selection: #4a4640;
        --surface: #35322e;
        --surface-highlight: #3e3b36;
        --border: #4a4640;
        --accent: #8a9a7e;
        --muted: #7a756c;
        --highlight: #5a554f;
        --black: #3a352f;
        --red: #a86060;
        --green: #7a8a60;
        --yellow: #9a8a60;
        --blue: #6c7c90;
        --magenta: #8a6e7a;
        --cyan: #6a8c82;
        --white: #c4bfb3;
        --lcd-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      color: var(--foreground);
      background: var(--background);
      margin: 0;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    main {
      text-align: center;
      padding: 1em;
      max-width: 240px;
      margin: 0 auto;
    }

    h3 {
      margin: 0 0 0.5em;
      text-shadow: var(--lcd-shadow);
    }

    h5 {
      margin: 0 0 0.5em;
      text-shadow: var(--lcd-shadow);
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    a:visited {
      color: var(--magenta);
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: var(--foreground);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.4em 0.8em;
      cursor: pointer;
    }
    button:hover {
      background: var(--surface-highlight);
    }

    ::selection {
      background: var(--selection);
    }

    ul {
      padding: 0;
      margin: 0 0 0.5em;
    }

    li {
      list-style: none;
    }

    .parking-item {
      display: flex;
      justify-content: space-between;
      padding: 0.25em 0;
    }

    .loading {
      opacity: 0.7;
    }

    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 0.5em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      margin: 0 0 0.5em;
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="loading">Henter data<span class="spinner"></span></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
